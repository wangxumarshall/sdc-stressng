name: release-image

# Fork-owned release pipeline (replaces the deleted upstream
# build-docker-image-stable): on a published Release, build the Dockerfile
# from the release tag and push it to ghcr as :stable and :<tag>.
# arm64 only — this project has no other target architecture.

on:
  release:
    types:
      - published

env:
  GITHUB_REGISTRY: ghcr.io

jobs:
  build-image:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Derive image repository (lowercase)
        run: echo "IMAGE_REPOSITORY=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log into ${{ env.GITHUB_REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GITHUB_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push release image
        uses: docker/build-push-action@v6
        with:
          push: true
          context: .
          tags: |
            ${{ env.GITHUB_REGISTRY }}/${{ env.IMAGE_REPOSITORY }}:stable
            ${{ env.GITHUB_REGISTRY }}/${{ env.IMAGE_REPOSITORY }}:${{ github.event.release.tag_name }}
          platforms: linux/arm64
